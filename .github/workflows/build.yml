name: Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Decides whether the change touches anything other than documentation.
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect code changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Documentation: *.md, docs/**, LICENSE*. Everything else (including .github/**) is code.
          # Pushes to main always count as code.
          code=true
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            files=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
            echo "Changed files:"
            echo "$files"
            code=false
            if [[ -z "$files" ]]; then
              code=true
            fi
            while IFS= read -r f; do
              [[ -z "$f" ]] && continue
              case "$f" in
                *.md|docs/*|LICENSE*) ;;
                *) code=true ;;
              esac
            done <<< "$files"
          fi
          echo "code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  verify:
    # Keep this name: branch protection requires a status check called "build".
    # The job always runs and reports; for docs-only changes its steps are skipped.
    name: build
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        if: needs.changes.outputs.code == 'true'
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Documentation-only change
        if: needs.changes.outputs.code != 'true'
        run: echo "Documentation-only change; Gradle verification skipped."

      - name: Verify formatting, unit tests, and release builds
        if: needs.changes.outputs.code == 'true'
        run: |
          ./gradlew \
            spotlessCheck \
            :motion:testDebugUnitTest \
            :motion:assembleRelease \
            :motion-ui:testDebugUnitTest \
            :motion-ui:assembleRelease \
            :motion-lab:testDebugUnitTest

  instrumentation:
    name: Compose UI tests · API 35 emulator
    # Skipped (which still satisfies a required check) for documentation-only changes.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Enable KVM access when the hosted runner exposes it
        run: |
          if [[ -e /dev/kvm ]]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
            sudo udevadm control --reload-rules || true
            sudo udevadm trigger --name-match=kvm || true
            sudo chmod a+rw /dev/kvm || true
          fi

          if [[ -e /dev/kvm && -r /dev/kvm && -w /dev/kvm ]]; then
            echo "KVM is available to the runner:"
            ls -l /dev/kvm
            id
          else
            echo "KVM is unavailable to the runner; falling back to TCG."
            ls -l /dev/kvm 2>/dev/null || echo "/dev/kvm is not exposed on this runner."
            id
            echo "ANDROID_I_WANT_MY_TCG=yes" >> "$GITHUB_ENV"
          fi

      - name: Run Motion Lab Compose UI tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          disable-linux-hw-accel: auto
          emulator-boot-timeout: 600
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: ./gradlew :motion-lab:connectedDebugAndroidTest
